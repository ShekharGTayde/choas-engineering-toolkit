global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ── Internal docker-compose services (prom-client /metrics) ─────────────────
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ['order-service:3000']

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:3000']

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:3000']

  # ── Blackbox Exporter — external / monitor-only targets ──────────────────────
  # Probes any HTTP/HTTPS URL registered as source=external-url.
  # The dashboard backend reads registered_servers.json and can query the
  # blackbox probe data using job="blackbox-external" label.
  # Add targets here as external URLs are registered; the dashboard's PromQL
  # query layer uses this job name to route external-source metric queries.
  - job_name: blackbox-external
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Placeholder — no external targets at boot.
      # The dashboard SSRF-protected /api/targets endpoint tracks registered
      # external URLs; this list would be populated via file_sd_configs or
      # a Prometheus reload in a production deployment.
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
