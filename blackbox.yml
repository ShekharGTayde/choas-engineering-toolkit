modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # Accept 2xx and 3xx — a redirect is still a reachable endpoint
      valid_status_codes: []   # empty = Prometheus default: 2xx only
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false
